name: Daily Seller Data Sync

on:
  schedule:
    - cron: '0 3 * * *'   # 3:00 AM UTC every day
  workflow_dispatch:        # Manual trigger from GitHub UI or `gh workflow run`

jobs:
  sync-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # needed to push the sync branch
      pull-requests: write   # needed to open the PR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Sync Script
        id: sync
        run: |
          node scripts/sync-seller-data.js 2>&1 | tee sync.log
          # Extract the summary block for the PR body
          SUMMARY=$(sed -n '/--- PR_SUMMARY_START ---/,/--- PR_SUMMARY_END ---/p' sync.log \
            | grep -v '--- PR_SUMMARY_START ---' \
            | grep -v '--- PR_SUMMARY_END ---')
          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          # Make it available to the PR creation step
          echo "PR_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY"        >> $GITHUB_ENV
          echo "EOF"             >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "sync: daily data update ${{ github.run_id }}"
          branch: "data-sync/${{ github.run_id }}"
          delete-branch: true
          title: "🔄 Daily Seller Sync — ${{ github.run_id }}"
          body: |
            Auto-generated by the [Daily Seller Sync](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.

            **Do NOT merge automatically.** Review the changes in `data.js` before merging.

            ---

            ### Sync Summary

            | Product | Selected Seller | Final Price | Stock | Flags |
            |---|---|---|---|---|
            ${{ env.PR_SUMMARY }}
          labels: "automated pr,sync"
          draft: false

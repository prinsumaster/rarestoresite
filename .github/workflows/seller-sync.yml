name: Daily Seller Data Sync

on:
  schedule:
    - cron: '0 3 * * *' # Run at 3:00 AM UTC every day
  workflow_dispatch: # Allow manual triggering

jobs:
  sync-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Sync Script
        id: sync
        run: |
          node scripts/sync-seller-data.js > sync.log 2>&1
          cat sync.log
          SUMMARY=$(sed -n '/--- PR_SUMMARY_START ---/,/--- PR_SUMMARY_END ---/p' sync.log | grep -v '--- PR_SUMMARY_START ---' | grep -v '--- PR_SUMMARY_END ---')
          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          echo "PR_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "sync: live data update from sellers"
          branch: "data-sync/daily-update"
          title: "🔄 Daily Seller Sync: Live Price & Stock Updates"
          body: |
            This PR was automatically generated by the Daily Seller Sync workflow.
            
            **Sync Summary:**
            ${{ env.PR_SUMMARY }}
            
            Please review the changes in `data.js` before merging.
          labels: "automated pr, sync"
